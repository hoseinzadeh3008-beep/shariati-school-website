media:
  input: images
  output: /images
  extensions: [jpg, jpeg, png, webp, gif]
  rename: false

content:
  - name: site_settings
    label: تنظیمات و محتوای صفحات سایت
    type: file
    path: data/site.json
    format: json
    fields:
      - name: brand
        label: مشخصات عمومی سایت
        type: object
        fields:
          - { name: name, label: نام هنرستان, type: string, required: true }
          - { name: tagline, label: شعار سایت, type: string }
          - { name: subline, label: زیرعنوان, type: string }
          - { name: logo, label: لوگوی سایت (اختیاری), type: image }
      - name: navigation
        label: منوی اصلی و لینک سامانه
        type: object
        fields:
          - name: items
            label: گزینه‌های منوی اصلی
            type: object
            list: true
            fields:
              - { name: label, label: عنوان گزینه, type: string, required: true }
              - { name: href, label: نشانی مقصد لینک, type: string, required: true }
          - { name: ctaLabel, label: متن دکمه ورود به سامانه, type: string }
          - { name: ctaUrl, label: نشانی سامانه, type: string }
      - name: home
        label: صفحه اصلی
        type: object
        fields:
          - { name: heroEyebrow, label: متن بالای عنوان, type: string }
          - { name: heroTitle, label: عنوان اصلی, type: string }
          - { name: heroHighlight, label: واژه رنگی عنوان, type: string }
          - { name: heroTitleEnd, label: ادامه عنوان اصلی, type: string }
          - { name: heroPrimaryLabel, label: متن دکمه اصلی, type: string }
          - { name: heroSecondaryLabel, label: متن دکمه دوم, type: string }
          - { name: heroPrimaryUrl, label: لینک دکمه اصلی, type: string }
          - { name: heroSecondaryUrl, label: لینک دکمه دوم, type: string }
          - { name: aboutPanelTitle, label: عنوان کارت شعار, type: string }
          - { name: aboutPanelSubtitle, label: زیرعنوان کارت شعار, type: string }
          - { name: organizationKicker, label: برچسب چارت سازمانی, type: string }
          - { name: fieldsKicker, label: برچسب بخش رشته‌ها, type: string }
          - { name: newsKicker, label: برچسب بخش اخبار, type: string }
          - { name: newsPanelTitle, label: عنوان کادر اطلاع‌رسانی اخبار, type: string }
          - { name: newsPanelText, label: متن کادر اطلاع‌رسانی اخبار, type: text }
          - { name: newsPanelButton, label: متن دکمه پنل اخبار, type: string }
          - { name: contactKicker, label: برچسب بخش تماس, type: string }
          - { name: footerText, label: متن پایین سایت, type: string }
          - { name: heroText, label: توضیح صفحه اصلی, type: text }
          - { name: heroImage, label: تصویر اصلی, type: image }
          - { name: heroImageAlt, label: توضیح تصویر اصلی, type: string }
          - { name: heroImageCaption, label: زیرنویس تصویر اصلی, type: string }
          - { name: aboutKicker, label: برچسب معرفی, type: string }
          - { name: aboutTitle, label: عنوان معرفی, type: string }
          - { name: aboutText, label: متن معرفی, type: text }
          - name: aboutFeatures
            label: نکات برجسته
            type: string
            list: true
          - { name: organizationTitle, label: عنوان چارت سازمانی, type: string }
          - { name: organizationSubtitle, label: توضیح چارت سازمانی, type: text }
          - { name: managerName, label: نام مدیر, type: string }
          - { name: managerRole, label: عنوان مدیر, type: string }
          - name: deputies
            label: معاونت‌ها
            type: object
            list: true
            fields:
              - { name: role, label: عنوان سمت, type: string, required: true }
              - { name: names, label: نام مسئول یا مسئولان, type: string }
          - name: departments
            label: سرپرستان رشته‌ها
            type: object
            list: true
            fields:
              - { name: title, label: نام رشته, type: string, required: true }
              - { name: supervisor, label: نام سرپرست, type: string }
          - { name: fieldsTitle, label: عنوان بخش رشته‌ها, type: string }
          - { name: fieldsIntro, label: توضیح بخش رشته‌ها, type: text }
          - { name: newsTitle, label: عنوان بخش اخبار, type: string }
          - { name: newsIntro, label: توضیح بخش اخبار, type: text }
          - { name: contactTitle, label: عنوان بخش تماس, type: string }
          - { name: contactIntro, label: توضیح بخش تماس, type: text }
          - { name: contactMessageTitle, label: عنوان پیام هنرستان, type: string }
          - { name: contactMessage, label: متن پیام هنرستان, type: text }
      - name: about
        label: صفحه درباره هنرستان
        type: object
        fields:
          - { name: title, label: عنوان صفحه, type: string }
          - { name: subtitle, label: زیرعنوان صفحه, type: text }
          - { name: introTitle, label: عنوان معرفی, type: string }
          - { name: introText, label: متن معرفی, type: text }
          - { name: approachTitle, label: عنوان رویکرد آموزشی, type: string }
          - name: approach
            label: کارت‌های رویکرد آموزشی
            type: object
            list: true
            fields:
              - { name: tag, label: برچسب, type: string }
              - { name: title, label: عنوان, type: string }
              - { name: description, label: توضیحات, type: text }
          - name: photos
            label: تصاویر صفحه درباره هنرستان
            type: object
            list: true
            fields:
              - { name: title, label: عنوان تصویر, type: string, required: true }
              - { name: image, label: فایل تصویر, type: image, required: true }
              - { name: alt, label: متن جایگزین تصویر, type: string }
      - name: fieldsPage
        label: صفحه رشته‌ها
        type: object
        fields:
          - { name: title, label: عنوان صفحه, type: string }
          - { name: subtitle, label: زیرعنوان صفحه, type: text }
      - name: fields
        label: رشته‌های هنرستان
        type: object
        list: true
        fields:
          - { name: name, label: نام رشته, type: string, required: true }
          - { name: slug, label: نام فایل صفحه رشته, type: string }
          - { name: icon, label: نماد رشته, type: string }
          - { name: description, label: توضیح کوتاه رشته, type: text }
          - { name: detailText, label: متن کامل درباره رشته, type: text }
          - { name: topicsTitle, label: عنوان موضوعات آموزشی, type: string }
          - name: topics
            label: موضوعات آموزشی
            type: string
            list: true
          - { name: skillsTitle, label: عنوان مهارت‌ها, type: string }
          - { name: skillsText, label: توضیح مهارت‌های مورد توجه, type: text }
          - { name: pathwaysTitle, label: عنوان زمینه‌های ادامه مسیر, type: string }
          - { name: pathwaysText, label: توضیح زمینه‌های ادامه مسیر, type: text }
      - name: contact
        label: اطلاعات تماس
        type: object
        fields:
          - { name: title, label: عنوان صفحه, type: string }
          - { name: subtitle, label: زیرعنوان صفحه, type: text }
          - { name: address, label: نشانی, type: text }
          - name: contacts
            label: شماره‌های تماس
            type: object
            list: true
            fields:
              - { name: label, label: عنوان شماره, type: string }
              - { name: phone, label: شماره برای تماس, type: string }
              - { name: display, label: شماره نمایشی, type: string }
          - { name: messageTitle, label: عنوان پیام, type: string }
          - { name: message, label: متن پیام, type: text }

  - name: news
    label: اخبار و اطلاعیه‌ها
    type: file
    path: data/news.json
    format: json
    list: true
    fields:
      - { name: title, label: عنوان خبر, type: string, required: true }
      - { name: category, label: دسته‌بندی, type: string, required: true }
      - { name: summary, label: خلاصه خبر, type: text, required: true }
      - { name: body, label: متن کامل خبر, type: text }
      - { name: date, label: تاریخ انتشار, type: string }
      - { name: icon, label: نماد, type: string }
      - { name: image, label: تصویر خبر, type: image }
      - { name: published, label: انتشار در سایت, type: boolean }

  - name: gallery
    label: گالری تصاویر
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - { name: title, label: عنوان تصویر, type: string, required: true }
      - name: category
        label: دسته‌بندی تصویر
        type: string
        required: true
        description: برای انتقال تصویر به دسته دیگر، مقدار این فیلد را تغییر دهید.
      - { name: description, label: توضیحات تصویر, type: text }
      - { name: image, label: فایل تصویر, type: image, required: true }
      - { name: alt, label: متن جایگزین تصویر, type: string }

settings:
  content:
    merge: true
  commit:
    templates:
      create: "افزودن محتوای سایت: {path}"
      update: "ویرایش محتوای سایت: {path}"
      delete: "حذف محتوای سایت: {path}"
      rename: "تغییر نام {oldPath} به {newPath}"
